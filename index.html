="reply-btn" style="cursor:pointer">↩ reply</span></div></div>`;div.querySelector('.react-btn').onclick=(e)=>{e.stopPropagation();const bar=document.createElement('div');bar.className='react-bar';EMOJIS.forEach(em=>{const s=document.createElement('span');s.textContent=em;s.onclick=()=>{toggleReaction('privateMessages',d.id,em);bar.remove()};bar.appendChild(s)});div.appendChild(bar)};div.querySelector('.reply-btn').onclick=()=>setReply({username:m.fromName,text:m.text});div.onclick=(e)=>{if(e.target.classList.contains('react-pill'))toggleReaction('privateMessages',d.id,e.target.dataset.emoji)};list.appendChild(div)});list.scrollTop=list.scrollHeight})}
}else if(currentNav==='groups'){
composer.style.display=currentGroup?'flex':'none';content.innerHTML=currentGroup?`<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><div><h3>${esc(currentGroup.name)}</h3><p style="font-size:11px;color:var(--muted)">${currentGroup.members?.length||1} member(s)</p></div><div style="display:flex;gap:6px"><button class="btn-s" id="inviteBtn" style="padding:6px 10px;border-radius:16px;font-size:11px">🔗 Invite</button>${currentGroup.admins?.includes(currentUser.uid)?`<button class="btn-s" id="delGroupBtn" style="padding:6px 10px;border-radius:16px;font-size:11px;color:var(--red)">Delete</button>`:''}<button class="btn-s" id="backGroupBtn" style="padding:6px 10px;border-radius:16px;font-size:11px">Back</button></div></div><div class="msg-list" id="msgList"></div>`: `<div style="padding:14px"><div style="display:flex;justify-content:space-between"><div><h3>My groups</h3><p style="color:var(--muted);font-size:12px">Private group spaces</p><p style="color:var(--dim);font-size:10px;font-weight:800;letter-spacing:1px;margin-top:10px">YOUR GROUP SPACES</p></div><button class="btn-green" id="createGroupBtn">+ Create group</button></div><div id="groupList"></div></div>`;
if(currentGroup){
document.getElementById('backGroupBtn').onclick=()=>{currentGroup=null;render()};
document.getElementById('inviteBtn').onclick=()=>{try{const link=`${location.origin}${location.pathname}?join=${currentGroup.id}`;document.getElementById('inviteLinkInput').value=link;document.getElementById('inviteModal').classList.add('show');document.getElementById('copyInvite').onclick=()=>{navigator.clipboard.writeText(link);alert('Copied!')};document.getElementById('waShare').onclick=()=>{window.open(`https://wa.me/?text=${encodeURIComponent('Join my group "'+currentGroup.name+'" on RossApp: '+link)}`,'_blank')};document.getElementById('closeInvite').onclick=()=>document.getElementById('inviteModal').classList.remove('show')}catch{}};
document.getElementById('delGroupBtn')?.addEventListener('click',async()=>{if(confirm(`Delete "${currentGroup.name}"?`)){try{await deleteDoc(doc(db,"groups",currentGroup.id));currentGroup=null;render()}catch(e){alert(e.message)}}});
const q=query(collection(db,"groupMessages"),orderBy("createdAt","asc"));unsub=onSnapshot(q,snap=>{const list=document.getElementById('msgList');if(!list)return;list.innerHTML='';snap.forEach(d=>{const m=d.data();if(m.groupId!==currentGroup.id)return;const div=document.createElement('div');div.className='msg-card';div.innerHTML=`<img class="avatar" src="${esc(m.photoURL||ava(m.username))}"><div class="msg-body"><b>${esc(m.username)}</b>${m.replyTo?`<div class="quote">${esc(m.replyTo.text||'')}</div>`:''}<p>${esc(m.text||'')}</p>${m.imageURL?`<img class="msg-img" src="${m.imageURL}">`:''}${makeReactionsHtml(m.reactions)}<div class="meta"><span class="react-btn" style="color:var(--green);cursor:pointer">😊 react</span><span class="reply-btn" style="cursor:pointer">↩ reply</span></div></div>`;div.querySelector('.react-btn').onclick=(e)=>{e.stopPropagation();const bar=document.createElement('div');bar.className='react-bar';EMOJIS.forEach(em=>{const s=document.createElement('span');s.textContent=em;s.onclick=()=>{toggleReaction('groupMessages',d.id,em);bar.remove()};bar.appendChild(s)});div.appendChild(bar)};div.querySelector('.reply-btn').onclick=()=>setReply(m);div.onclick=(e)=>{if(e.target.classList.contains('react-pill'))toggleReaction('groupMessages',d.id,e.target.dataset.emoji)};list.appendChild(div)});list.scrollTop=list.scrollHeight})}
else{
document.getElementById('createGroupBtn').onclick=document.getElementById('addGroupBtn').onclick;
const q=query(collection(db,"groups"),orderBy("createdAt","desc"));onSnapshot(q,snap=>{const list=document.getElementById('groupList');if(!list)return;list.innerHTML='';snap.forEach(d=>{const g=d.data();g.id=d.id;if(!g.members?.includes(currentUser.uid))return;const row=document.createElement('div');row.className='group-card';row.innerHTML=`<div style="display:flex;gap:10px;align-items:center"><div class="avatar" style="background:#0f3d2a;color:var(--green)">◇</div><div><div style="font-weight:700;font-size:13px">${esc(g.name)}</div><div style="font-size:11px;color:var(--muted)">${g.members.length} member(s) • private</div></div></div><button class="btn-green">Open</button>`;row.onclick=()=>{currentGroup=g;render()};list.appendChild(row)})})}
}else if(currentNav==='people'){
composer.style.display='none';content.innerHTML=`<div style="padding:14px"><h3>People</h3><p style="color:var(--muted);font-size:12px">Find and connect</p></div><div id="peopleList"></div>`;const q=query(collection(db,"presence"),orderBy("lastSeen","desc"));onSnapshot(q,snap=>{const list=document.getElementById('peopleList');if(!list)return;list.innerHTML='';snap.forEach(d=>{const u=d.data();const row=document.createElement('div');row.className='dm-card';row.innerHTML=`<img class="avatar" src="${esc(u.photoURL||ava(u.username))}"><div style="flex:1"><div style="font-weight:700;font-size:13px">${esc(u.username)}</div><div style="font-size:11px;color:var(--muted)">${esc(u.about||'')}</div></div><span style="font-size:11px;color:${u.online?'#10B981':'var(--dim)'}">${u.online?'● online':'○ offline'}</span>`;list.appendChild(row)})})}
}catch(e){console.error('Render error',e);content.innerHTML=`<div style="padding:20px;color:var(--red);text-align:center">Error loading, please reload page. ${esc(e.message)}</div>`}
}
async function loadComments(postId){
try{
const q=query(collection(db,"postComments"),orderBy("createdAt","asc"));if(unsubComments)unsubComments();unsubComments=onSnapshot(q,snap=>{
const list=document.getElementById('commentList');if(!list)return;list.innerHTML='';snap.forEach(d=>{const c=d.data();if(c.postId!==postId)return;const div=document.createElement('div');div.className='comment-item';div.innerHTML=`<img class="avatar" src="${esc(c.photoURL||ava(c.username))}"><div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:11px;color:var(--green)">${esc(c.username)}</b><span style="font-size:9px;color:var(--dim)">${c.createdAt?.toDate?c.createdAt.toDate().toLocaleTimeString():''}</span></div><p style="font-size:12px;margin-top:2px">${esc(c.text)}</p></div>`;list.appendChild(div)});if(list.children.length===0)list.innerHTML=`<div style="text-align:center;padding:10px;color:var(--dim);font-size:12px">No comments yet. Be first!</div>`;
});
}catch(e){console.log(e)}
}
document.getElementById('fileInput').onchange=async(e=>{try{const f=e.target.files[0];if(!f)return;pendingImage=await compress(f);document.getElementById('imgPrev').src=pendingImage;document.getElementById('imgPrev').style.display='block'}catch(err){alert('Image error: '+err)}});
document.getElementById('sendBtn').onclick=async()=>{
try{
const text=msgInput.value.trim();if(!text&&!pendingImage)return;const btn=document.getElementById('sendBtn');btn.textContent='...';btn.disabled=true;
const base={username:currentProfile?.displayName||currentUser.displayName||'User',uid:currentUser.uid,photoURL:currentProfile?.photoURL||'',replyTo:replyTo?{username:replyTo.username||replyTo.fromName||'',text:(replyTo.text||'').slice(0,120)}:null,createdAt:serverTimestamp(),text:text||'',imageURL:pendingImage||null,reactions:{}};
if(currentNav==='channels'){await addDoc(collection(db,"messages"),{...base,channel:currentChannel})}
else if(currentNav==='posts'){await addDoc(collection(db,"posts"),{username:base.username,uid:base.uid,photoURL:base.photoURL,text:text||'',imageURL:pendingImage||null,likes:[],likesCount:0,commentsCount:0,createdAt:serverTimestamp()})}
else if(currentNav==='dms'&&currentDM){await addDoc(collection(db,"privateMessages"),{text:text||'',imageURL:pendingImage||null,fromUid:currentUser.uid,toUid:currentDM.uid,fromName:base.username,photoURL:base.photoURL,replyTo:base.replyTo,reactions:{},createdAt:serverTimestamp()})}
else if(currentNav==='groups'&&currentGroup){await addDoc(collection(db,"groupMessages"),{...base,groupId:currentGroup.id})}
msgInput.value='';pendingImage=null;document.getElementById('imgPrev').style.display='none';replyTo=null;document.getElementById('replyBar').classList.remove('show');
btn.textContent='Send';btn.disabled=false;
}catch(e){alert('Send failed: '+e.message);document.getElementById('sendBtn').textContent='Send';document.getElementById('sendBtn').disabled=false}
};
document.getElementById('sendCommentBtn').onclick=async()=>{
try{
const text=document.getElementById('commentInput').value.trim();if(!text||!currentPostId)return;
const btn=document.getElementById('sendCommentBtn');btn.textContent='...';btn.disabled=true;
await addDoc(collection(db,"postComments"),{postId:currentPostId,uid:currentUser.uid,username:currentProfile?.displayName||'User',photoURL:currentProfile?.photoURL||'',text,createdAt:serverTimestamp()});
const postRef=doc(db,"posts",currentPostId);const snap=await getDoc(postRef);if(snap.exists()){const cur=snap.data().commentsCount||0;await updateDoc(postRef,{commentsCount:cur+1})}
document.getElementById('commentInput').value='';btn.textContent='Reply';btn.disabled=false;
}catch(e){alert(e.message);document.getElementById('sendCommentBtn').textContent='Reply';document.getElementById('sendCommentBtn').disabled=false}
};
document.getElementById('closeComment').onclick=()=>{document.getElementById('commentModal').classList.remove('show');if(unsubComments)unsubComments();currentPostId=null};
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('sendBtn').click()}});
async function loadProfile(){try{const snap=await getDoc(doc(db,"profiles",currentUser.uid));if(snap.exists()){currentProfile=snap.data();document.getElementById('profName').value=currentProfile.displayName||'';document.getElementById('profAbout').value=currentProfile.about||'';if(currentProfile.photoURL)document.getElementById('profPicPreview').src=currentProfile.photoURL;document.getElementById('userTop').textContent=currentProfile.displayName} else {currentProfile={displayName:currentUser.displayName||currentUser.email.split('@')[0],about:'Hey there! I am using RossApp...',photoURL:currentUser.photoURL||''};document.getElementById('profName').value=currentProfile.displayName;document.getElementById('profAbout').value=currentProfile.about;document.getElementById('userTop').textContent=currentProfile.displayName}
await setDoc(doc(db,"presence",currentUser.uid),{uid:currentUser.uid,username:currentProfile.displayName,photoURL:currentProfile.photoURL||'',about:currentProfile.about||'',online:true,lastSeen:serverTimestamp()},{merge:true});await handleJoin()}catch(e){console.log(e)}}
document.getElementById('profFile').onchange=async(e=>{try{const f=e.target.files[0];if(!f)return;const comp=await compress(f,300);document.getElementById('profPicPreview').src=comp;document.getElementById('profPicPreview').dataset.temp=comp}catch(err){alert(err)}});
document.getElementById('saveProf').onclick=async()=>{const name=document.getElementById('profName').value.trim();const about=document.getElementById('profAbout').value.trim();let photoURL=currentProfile?.photoURL||'';const temp=document.getElementById('profPicPreview').dataset.temp;if(temp)photoURL=temp;const btn=document.getElementById('saveProf');btn.textContent='Saving...';btn.disabled=true;try{await setDoc(doc(db,"profiles",currentUser.uid),{displayName:name,about,photoURL,uid:currentUser.uid,updatedAt:serverTimestamp()},{merge:true});await updateProfile(currentUser,{displayName:name,photoURL:photoURL||null}).catch(()=>{});await setDoc(doc(db,"presence",currentUser.uid),{uid:currentUser.uid,username:name,photoURL,about,online:true,lastSeen:serverTimestamp()},{merge:true});currentProfile={displayName:name,about,photoURL};document.getElementById('userTop').textContent=name;document.getElementById('profileModal').classList.remove('show');render()}catch(e){alert(e.message)}finally{btn.textContent='Save';btn.disabled=false}};
document.getElementById('cancelProf').onclick=()=>document.getElementById('profileModal').classList.remove('show');
document.getElementById('btnLogin').onclick=async()=>{const e=document.getElementById('liEmail').value.trim(),p=document.getElementById('liPass').value;if(!e||!p){document.getElementById('authErr').textContent='Enter email & password';return}try{await signInWithEmailAndPassword(auth,e,p)}catch(err){document.getElementById('authErr').textContent=err.message}};
document.getElementById('btnSignup').onclick=async()=>{const e=document.getElementById('liEmail').value.trim(),p=document.getElementById('liPass').value;if(p.length<6){document.getElementById('authErr').textContent='Password min 6';return}try{await createUserWithEmailAndPassword(auth,e,p)}catch(err){document.getElementById('authErr').textContent=err.message}};
document.getElementById('btnGoogle').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){document.getElementById('authErr').textContent=e.message}};
document.getElementById('logoutBtn').onclick=async()=>{try{if(currentUser)await setDoc(doc(db,"presence",currentUser.uid),{online:false,lastSeen:serverTimestamp()},{merge:true});await signOut(auth)}catch{await signOut(auth)}};
onAuthStateChanged(auth,async(user)=>{if(user){currentUser=user;authDiv.style.display='none';await loadProfile();render()}else{currentUser=null;authDiv.style.display='flex';content.innerHTML=''}});
</script></body></html>
