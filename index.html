<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RossApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between">

  <!-- TOP HEADER -->
  <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-400"># ROSSAPP</h1>
    <div id="user-status" class="text-sm text-gray-400">Not logged in</div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 overflow-y-auto p-4 max-w-2xl w-full mx-auto flex flex-col">

    <!-- AUTH SECTION (Show when logged out) -->
    <div id="auth-section" class="bg-gray-900 p-6 rounded-lg border border-gray-800 space-y-4 my-auto">
      <h2 class="text-lg font-semibold text-center text-white">Welcome to RossApp</h2>
      
      <!-- Email Login Form -->
      <div class="space-y-3">
        <input id="auth-email" type="email" placeholder="Email address" class="w-full p-2 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500" />
        
        <!-- Password field with Show/Hide Eye toggle -->
        <div class="relative">
          <input id="auth-password" type="password" placeholder="Password" class="w-full p-2 pr-10 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500" />
          <button type="button" id="toggle-password-btn" class="absolute right-2 top-2 text-gray-400 hover:text-white focus:outline-none">
            👁️
          </button>
        </div>

        <div class="flex gap-2">
          <button id="email-login-btn" class="flex-1 bg-green-500 hover:bg-green-600 font-bold py-2 rounded text-black">Log In</button>
          <button id="email-signup-btn" class="flex-1 bg-gray-700 hover:bg-gray-600 font-bold py-2 rounded text-white">Sign Up</button>
        </div>
      </div>

      <div class="text-center text-xs text-gray-500">OR</div>

      <!-- Google Login -->
      <button id="google-login-btn" class="w-full bg-white text-gray-900 font-bold py-2 rounded flex justify-center items-center gap-2 hover:bg-gray-100">
        Sign in with Google
      </button>
    </div>

    <!-- APP CHAT SECTION (Show when logged in) -->
    <div id="chat-section" class="flex-1 flex flex-col space-y-4 hidden h-full">
      
      <!-- Channel Navigation -->
      <div class="flex gap-2 border-b border-gray-800 pb-2">
        <button class="channel-btn bg-green-500 text-black px-3 py-1 rounded text-sm font-semibold" data-channel="general"># General</button>
        <button class="channel-btn bg-gray-800 text-gray-300 px-3 py-1 rounded text-sm hover:bg-gray-700" data-channel="unlimited"># Unlimited</button>
        <button class="channel-btn bg-gray-800 text-gray-300 px-3 py-1 rounded text-sm hover:bg-gray-700" data-channel="memes"># Memes</button>
        <button id="open-profile-btn" class="ml-auto bg-gray-800 text-gray-300 px-3 py-1 rounded text-sm hover:bg-gray-700">⚙️ Profile</button>
      </div>

      <!-- Messages Container -->
      <div id="messages-container" class="flex-1 bg-gray-900 border border-gray-800 rounded p-4 overflow-y-auto space-y-3 min-h-[300px]">
        <div class="text-gray-500 text-center">Loading messages...</div>
      </div>

      <!-- Send Input -->
      <div class="flex gap-2">
        <input id="message-input" type="text" placeholder="Type a message..." class="flex-1 p-2 bg-gray-900 border border-gray-800 rounded text-white focus:outline-none focus:border-green-500" />
        <button id="send-btn" class="bg-green-500 hover:bg-green-600 text-black font-bold px-4 py-2 rounded">Send</button>
      </div>
    </div>

  </main>

  <!-- PROFILE MODAL -->
  <div id="profile-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden p-4">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-lg w-full max-w-md space-y-4">
      <h3 class="text-lg font-bold text-white">Your Profile</h3>
      
      <div>
        <label class="text-xs text-gray-400 block mb-1">Display Name</label>
        <input id="profile-name" type="text" class="w-full p-2 bg-gray-800 border border-gray-700 rounded text-white" />
      </div>

      <div>
        <label class="text-xs text-gray-400 block mb-1">Bio</label>
        <textarea id="profile-bio" rows="3" class="w-full p-2 bg-gray-800 border border-gray-700 rounded text-white"></textarea>
      </div>

      <div class="flex justify-end gap-2">
        <button id="close-profile-btn" class="px-4 py-2 bg-gray-800 rounded text-gray-300">Cancel</button>
        <button id="save-profile-btn" class="px-4 py-2 bg-green-500 text-black font-bold rounded">Save Profile</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPT LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      query, 
      where, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Firebase configuration (Fully pre-filled)
    const firebaseConfig = {
      apiKey: "AIzaSyCbRdUKuoewEKgr-NzHN2nhxeQwCxPSaRk",
      authDomain: "rossapp-7fa7b.firebaseapp.com",
      projectId: "rossapp-7fa7b",
      storageBucket: "rossapp-7fa7b.firebasestorage.app",
      messagingSenderId: "510967530207",
      appId: "1:510967530207:web:baefad473d574f08ee5f6a",
      measurementId: "G-Z2GCLKR37X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let currentChannel = "general";
    let unsubscribeMessages = null;

    // --- DOM Elements ---
    const authSection = document.getElementById('auth-section');
    const chatSection = document.getElementById('chat-section');
    const userStatus = document.getElementById('user-status');
    const messagesContainer = document.getElementById('messages-container');
    
    // --- 1. Password Visibility Toggle ---
    const authPasswordInput = document.getElementById('auth-password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    
    togglePasswordBtn.addEventListener('click', () => {
      const type = authPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      authPasswordInput.setAttribute('type', type);
      togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // --- 2. Auth Listeners & Mobile Popup Login ---
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        alert("Google login error: " + err.message);
      }
    });

    document.getElementById('email-login-btn').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = authPasswordInput.value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });

    document.getElementById('email-signup-btn').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = authPasswordInput.value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Signup failed: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        chatSection.classList.remove('hidden');
        userStatus.innerHTML = `Logged in as <b>${user.displayName || user.email}</b> <button id="logout-btn" class="ml-2 text-xs text-red-400 underline">Logout</button>`;
        
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
        loadMessages(currentChannel);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        chatSection.classList.add('hidden');
        userStatus.textContent = 'Not logged in';
      }
    });

    // --- 3. Message Query (Simplified to avoid index errors) ---
    function loadMessages(channel) {
      if (unsubscribeMessages) unsubscribeMessages();

      const q = query(collection(db, "messages"), where("channel", "==", channel));

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = "";
        
        let docs = snapshot.docs.map(doc => doc.data());
        
        // Sort locally to prevent requiring composite index in Firestore
        docs.sort((a, b) => (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0));

        if (docs.length === 0) {
          messagesContainer.innerHTML = `<div class="text-gray-500 text-center py-4">No messages in #${channel} yet. Be the first to chat!</div>`;
          return;
        }

        docs.forEach(msg => {
          const div = document.createElement('div');
          div.className = "bg-gray-800 p-2 rounded text-sm";
          div.innerHTML = `<span class="font-bold text-green-400">${msg.username || 'User'}:</span> <span class="text-gray-200">${msg.text}</span>`;
          messagesContainer.appendChild(div);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, (error) => {
        messagesContainer.innerHTML = `<div class="text-red-400 text-center py-4">Error loading messages: ${error.message}</div>`;
      });
    }

    // Channel Switching
    document.querySelectorAll('.channel-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.channel-btn').forEach(b => {
          b.className = "channel-btn bg-gray-800 text-gray-300 px-3 py-1 rounded text-sm hover:bg-gray-700";
        });
        e.target.className = "channel-btn bg-green-500 text-black px-3 py-1 rounded text-sm font-semibold";
        currentChannel = e.target.getAttribute('data-channel');
        loadMessages(currentChannel);
      });
    });

    // Send Message
    document.getElementById('send-btn').addEventListener('click', async () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          channel: currentChannel,
          uid: currentUser.uid,
          username: currentUser.displayName || currentUser.email.split('@')[0],
          timestamp: serverTimestamp()
        });
        input.value = "";
      } catch (err) {
        alert("Failed to send: " + err.message);
      }
    });

    // --- 4. Free Profile Save (No Storage Needed) ---
    const profileModal = document.getElementById('profile-modal');
    document.getElementById('open-profile-btn').addEventListener('click', () => profileModal.classList.remove('hidden'));
    document.getElementById('close-profile-btn').addEventListener('click', () => profileModal.classList.add('hidden'));

    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      if (!currentUser) return;
      const name = document.getElementById('profile-name').value;
      const bio = document.getElementById('profile-bio').value;

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          displayName: name,
          bio: bio,
          updatedAt: serverTimestamp()
        }, { merge: true });

        alert("Profile saved successfully!");
        profileModal.classList.add('hidden');
      } catch (err) {
        alert("Save failed: " + err.message);
      }
    });
  </script>
</body>
</html>
